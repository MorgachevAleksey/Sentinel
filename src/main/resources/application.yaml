spring:
  application:
    name: sentinel
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

sentinel:
  version: "0.1"
  market-data:
    base-url: https://iss.moex.com/iss/reference/
    timeout-seconds: 30
    retry:
      max-attempts: 3
      backoff-ms: 1000

